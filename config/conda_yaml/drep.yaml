# dRep 4 uses skani for both primary and secondary clustering (dRep 3.2.0 used Mash + fastANI). CheckM is not
# needed: make_das_and_drep_inputs writes genome_info.csv with completeness and contamination for every bin.
channels:
  - conda-forge
  - bioconda
dependencies:
  - drep=4.0.3
  - skani=0.4.0
