# MetaDecoder 1.0.13 with GPU clustering (cupy, CUDA 11.6 runtime). MetaDecoder is not on PyPI or bioconda; the
# wheel is from its GitHub release and pins numpy 1.18.5, scipy 1.5.4, and scikit-learn 0.23.2 (Python 3.8).
# Matches the named "metadecoder" env on Huron. Without cudatoolkit, cupy cannot load libcudart.so.11.0 and
# MetaDecoder silently falls back to CPU clustering.
name: metadecoder
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.8
  - pip
  - samtools
  - cudatoolkit=11.6
  - pip:
      - https://github.com/liu-congcong/MetaDecoder/releases/download/v1.0.13/metadecoder-1.0.13-py3-none-any.whl
      - cupy-cuda116==10.6.0
      - fastrlock==0.8.2
