## These are the default settings for the GLAMR omics pipeline's snakemake workflow.
## Any local configuration should be written to config.yaml

jobs: 100
local-cores: 1
software-deployment-method:
  - conda
  - apptainer
default-resources: [mem_mb=4000, time_min=120]
resources: [mem_mb=700000]
max-status-checks-per-second: 1

## NCBI API key, this may speed up some the downloading and other interactions
## with the NCBI servers
# ncbi_api_key:

## Alternatively you may want to store the NCBI API key in a dedicated file
# ncbi_api_key_file: ./my_ncbi_api.key

## Make kingfisher randomly wait 0-30s before running.  This can avoid sending
## too many requests at once when processing many samples in parallel.  This may
## not do anything if you're running on SLURM and your rule has heavy_network=1
## in resources.  This is yes/no,
# kingfisher_slowdown: no

## Path to file that keep track of output files during post-production
# checkout_file: data/output_files_checkout.tsv
checkout_file:

## Path to file that keep track of conda package versions during post-production
# versions_file: data/versions.json
versions_file:

## Path to collected benchmark results (maintainted by post-production)
# collect_benchmarks: data/benchmarks.tsv
collect_benchmarks:

## Run the post-production step.  Shortcut to skip post-production when running
# tests.  If set to 'no' then no post-production is run even if the above
# post-production files are set.  If the three files are set empty then this
# setting has no effect.  [yes or no]
post-production: yes


## The Snakefile needs this key set to something, you'll need to set this
## properly for certain parts of the workflow to run correctly
binning_bam_dir: /nosuchdirectory/no-such-file-{sample_type}-{project}-{sample}

amplicon_taxonomy_dbs:
  16S_rRNA_bac: data/reference/dada2/silva_nr99_v138.2_toSpecies_trainset.fa.gz
  16S_rRNA_arc: data/reference/dada2/silva_nr99_v138.2_toSpecies_trainset.fa.gz
  12S_rRNA_mito: data/reference/midori2/GB273/MIDORI2_UNIQ_NUC_GB273_srRNA_DADA2.notaxid.fasta.gz
  16S_rRNA_mito: data/reference/midori2/GB273/MIDORI2_UNIQ_NUC_GB273_lrRNA_DADA2.notaxid.fasta.gz
  18S_rRNA_euk: data/reference/dada2/pr2_version_5.1.1_SSU_dada2.fasta.gz
  COI_mito: data/reference/midori2/GB273/MIDORI2_UNIQ_NUC_GB273_CO1_DADA2.notaxid.fasta.gz
  ITS_euk: data/reference/unite/2025-02-19/unite_general_release_all_19.02.2025_dada2.fasta.gz

## Rank names for taxonomy DBs that don't use the default
## Kingdom,Phylum,Class,Order,Family,Genus,Species
amplicon_taxonomy_levels:
  12S_rRNA_mito: Phylum,Class,Order,Family,Genus,Species
  16S_rRNA_mito: Phylum,Class,Order,Family,Genus,Species
  18S_rRNA_euk: Domain,Supergroup,Division,Subdivision,Class,Order,Family,Genus,Species
  COI_mito: Phylum,Class,Order,Family,Genus,Species

## Assign taxonomy for these models from vsearch global alignment top hits
## (consensus, rule amplicon_vsearch_taxonomy) instead of assignTaxonomy, which
## does poorly on COI and mito 12S/16S.  Uses the db from amplicon_taxonomy_dbs,
## min_identity is the minimum best-hit identity per rank (same order as
## amplicon_taxonomy_levels).
amplicon_taxonomy_vsearch:
  12S_rRNA_mito:
    min_identity: 0.75,0.85,0.85,0.90,0.95,0.98
  COI_mito:
    min_identity: 0.75,0.85,0.85,0.90,0.95,0.98
  16S_rRNA_mito:
    min_identity: 0.75,0.85,0.85,0.90,0.95,0.98

## Memory (MB) for taxonomy assignment where the default (16000) is not
## enough, assignTaxonomy memory scales with the number of distinct lineages
amplicon_taxonomy_mem_mb:
  ITS_euk: 24000

## Re-classify organelle ASVs from 16S_rRNA_bac targets against PR2's organelle
## 16S sequences (labeled with the eukaryotic host taxonomy).  ASVs are picked by
## their SILVA assignment (silva_rank == silva_value).  The db files are built
## from the PR2 merged table by rule pr2_organelle_dada2_db, keeping the listed
## pr2_organelles.
amplicon_organelle_taxonomy:
  plastid:
    silva_rank: Order
    silva_value: Chloroplast
    pr2_organelles: plastid,apicoplast,chromatophore
    db: data/reference/dada2/pr2_version_5.1.1_plastid16S_dada2.fasta.gz
    tax_levels: Domain,Supergroup,Division,Subdivision,Class,Order,Family,Genus,Species
  mitochondria:
    silva_rank: Family
    silva_value: Mitochondria
    pr2_organelles: mitochondrion
    db: data/reference/dada2/pr2_version_5.1.1_mitochondria16S_dada2.fasta.gz
    tax_levels: Domain,Supergroup,Division,Subdivision,Class,Order,Family,Genus,Species

## Stand-alone shell script that takes a Slurm jobid as parameter and prints
## out the job's status.  If a relative path is given, then this is relative to
## the base directory.
slurm_status_cmd: "code/slurm_status"

## Primer pairs that amplify both 16S and 18S (515F-Y/926R, Parada et al. 2016):
## samples assigned to one of these 16S targets also get their reads split into
## 16S and 18S (bbsplit), and the 18S reads are processed as target_18S
## (concatenating fwd and rev reads, which don't overlap).  Samples with fewer
## than min_pairs 18S read pairs are skipped for the 18S target.
amplicon_split_18S:
  targets:
    - 16S_rRNA_bac.515F.926R
  target_18S: 18S_rRNA_euk.515F_18S.926R_18S
  min_pairs: 100

## Models whose dada2 targets always concatenate fwd and rev reads instead of
## merging them: ITS length varies a lot and is often too long for the read
## pairs to overlap (otherwise concatenation only happens automatically when
## the expected overlap is too short)
amplicon_concatenate_models:
  - ITS_euk
