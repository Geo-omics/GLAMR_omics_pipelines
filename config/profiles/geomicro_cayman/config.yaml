jobs: 1000
local-cores: 1
executor: cluster-generic
cluster-generic-submit-cmd: "mkdir -p logs/slurm && sbatch --parsable --time={resources.time_min} --mem={resources.mem_mb} -c {threads} -o logs/slurm/{rule}_{wildcards} -e logs/slurm/{rule}_{wildcards} --nodelist=cayman" #--exclude=alpena
cluster-generic-cancel-cmd: "scancel"
software-deployment-method:
  - conda
  - apptainer
default-resources: [mem_mb=8000, time_min=120, ncbi_api=0, gpu=0, disk_mb=100]
#resources: [disk_mb=2000000]
resources: [mem_mb=1000000000, ncbi_api=5, disk_mb=2000000]
latency-wait: 10
cluster-generic-status-cmd: "${SLURM_STATUS_CMD:-/nfs/turbo/lsa-kiledal/GLAMR/pypelib/slurm_status.py}"
max-status-checks-per-second: 10
singularity-args: "--home $HOME:/home/$USER --bind /nfs/turbo/lsa-gdick2/geomicro --bind /nfs:/nfs"
precommand: "mkdir -p logs/slurm/ logs/ benchmarks/"
rerun-triggers: mtime
