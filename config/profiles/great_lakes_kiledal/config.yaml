jobs: 2000
local-cores: 1
executor: cluster-generic
cluster-generic-submit-cmd: "sbatch --parsable --account={resources.account} --partition={resources.partition} --time={resources.time_min} --mem={resources.mem_mb} -c {threads} --gres=gpu:{resources.gpu} -o logs/slurm/{rule}_{wildcards} -e logs/slurm/{rule}_{wildcards}"
cluster-generic-cancel-cmd: "scancel"
software-deployment-method:
  - conda
  - apptainer
default-resources: [mem_mb=8000, time_min=120, account=kiledal0, partition=standard, ncbi_api=0, gpu=0, disk_mb=100]
resources: [scratch_disk_mb=5000000, ncbi_api=5]
#resources: [disk_mb=2000000]
#resources: [mem_mb=100000000, heavy_network=1, disk_mb=2000000]
latency-wait: 30
cluster-generic-status-cmd: "${SLURM_STATUS_CMD:-/nfs/turbo/lsa-kiledal/GLAMR/pypelib/slurm_status.py}"
max-status-checks-per-second: 1
singularity-args: "--home /home/$USER:/home/$USER --bind /scratch/gdick_root/ --bind /nfs/turbo/lsa-gdick2/geomicro/data2/kiledal/ --bind /gpfs/accounts/gdick_root/ --bind /nfs:/nfs"
rerun-triggers: mtime
